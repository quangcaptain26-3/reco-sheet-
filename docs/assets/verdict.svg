<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" width="1200" height="352" role="img" aria-labelledby="verdictTitle verdictDesc">
  <title id="verdictTitle">Bốn nhóm kết quả đối soát</title>
  <desc id="verdictDesc">Khớp hoàn toàn, lệch giá trị, chỉ có ở A và chỉ có ở B, kèm công thức delta và tổng chênh lệch.</desc>

  <defs>
    <filter id="verdictShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0a0a0a" flood-opacity="0.07"/>
    </filter>
    <clipPath id="clip1"><rect x="60" y="70" width="252" height="184" rx="14"/></clipPath>
    <clipPath id="clip2"><rect x="336" y="70" width="252" height="184" rx="14"/></clipPath>
    <clipPath id="clip3"><rect x="612" y="70" width="252" height="184" rx="14"/></clipPath>
    <clipPath id="clip4"><rect x="888" y="70" width="252" height="184" rx="14"/></clipPath>
  </defs>

  <text x="60" y="34" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.8" fill="#737373">KẾT QUẢ PHÂN LOẠI</text>
  <text x="1140" y="34" text-anchor="end" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#a3a3a3">Ví dụ từ bộ dữ liệu mẫu</text>

  <!-- Card 1 -->
  <g filter="url(#verdictShadow)"><rect x="60" y="70" width="252" height="184" rx="14" fill="#ffffff" stroke="#a7f3d0"/></g>
  <g clip-path="url(#clip1)"><rect x="60" y="70" width="252" height="6" fill="#059669"/></g>
  <text x="84" y="104" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#047857">NHÓM 01 · VERIFY</text>
  <text x="84" y="152" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="600" letter-spacing="-1" fill="#0a0a0a">8</text>
  <text x="120" y="152" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#737373">/ 14 dòng</text>
  <text x="84" y="180" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#065f46">Khớp hoàn toàn</text>
  <text x="84" y="203" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="10.5" fill="#737373">ORD-101 · 1.250.000</text>
  <rect x="84" y="218" width="152" height="22" rx="6" fill="#ecfdf5"/>
  <text x="94" y="233" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#047857">Δ trong dung sai</text>

  <!-- Card 2 -->
  <g filter="url(#verdictShadow)"><rect x="336" y="70" width="252" height="184" rx="14" fill="#ffffff" stroke="#fde68a"/></g>
  <g clip-path="url(#clip2)"><rect x="336" y="70" width="252" height="6" fill="#ea580c"/></g>
  <text x="360" y="104" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#9a3412">NHÓM 02 · CAUTION</text>
  <text x="360" y="152" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="600" letter-spacing="-1" fill="#0a0a0a">2</text>
  <text x="385" y="152" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#737373">cặp lệch</text>
  <text x="360" y="180" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#9a3412">Lệch giá trị</text>
  <text x="360" y="203" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="10.5" fill="#737373">Δ −45.000 · +45.000</text>
  <rect x="360" y="218" width="160" height="22" rx="6" fill="#fffbeb"/>
  <text x="370" y="233" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#9a3412">Δ vượt dung sai</text>

  <!-- Card 3 -->
  <g filter="url(#verdictShadow)"><rect x="612" y="70" width="252" height="184" rx="14" fill="#ffffff" stroke="#fecdd3"/></g>
  <g clip-path="url(#clip3)"><rect x="612" y="70" width="252" height="6" fill="#be123c"/></g>
  <text x="636" y="104" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#9f1239">NHÓM 03 · ALARM</text>
  <text x="636" y="152" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="600" letter-spacing="-1" fill="#0a0a0a">2</text>
  <text x="661" y="152" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#737373">mã thiếu</text>
  <text x="636" y="180" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#9f1239">Chỉ có ở A</text>
  <text x="636" y="203" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="10.5" fill="#737373">ORD-107 · 2.300.000</text>
  <rect x="636" y="218" width="152" height="22" rx="6" fill="#fff1f2"/>
  <text x="646" y="233" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#9f1239">không thấy ở tệp B</text>

  <!-- Card 4 -->
  <g filter="url(#verdictShadow)"><rect x="888" y="70" width="252" height="184" rx="14" fill="#ffffff" stroke="#bae6fd"/></g>
  <g clip-path="url(#clip4)"><rect x="888" y="70" width="252" height="6" fill="#0369a1"/></g>
  <text x="912" y="104" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#075985">NHÓM 04 · COMPARE</text>
  <text x="912" y="152" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="600" letter-spacing="-1" fill="#0a0a0a">2</text>
  <text x="937" y="152" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#737373">mã thiếu</text>
  <text x="912" y="180" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#075985">Chỉ có ở B</text>
  <text x="912" y="203" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="10.5" fill="#737373">ORD-106 · 700.000</text>
  <rect x="912" y="218" width="152" height="22" rx="6" fill="#f0f9ff"/>
  <text x="922" y="233" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#075985">không thấy ở tệp A</text>

  <!-- Delta strip -->
  <rect x="60" y="278" width="1080" height="48" rx="12" fill="#f5f5f5"/>
  <text x="84" y="307" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="12" fill="#525252">Δ = Giá trị B − Giá trị A</text>
  <text x="1116" y="307" text-anchor="end" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#525252">Tổng chênh lệch mẫu <tspan font-weight="700" fill="#0a0a0a">−95.000 ₫</tspan></text>

  <text x="600" y="344" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#a3a3a3">Dung sai được so sánh bằng abs(Δ) ≤ tolerance</text>
</svg>
