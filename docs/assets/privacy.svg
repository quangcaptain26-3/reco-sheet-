<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 292" width="1200" height="292" role="img" aria-labelledby="privacyTitle privacyDesc">
  <title id="privacyTitle">Zero-server: dữ liệu không rời khỏi trình duyệt</title>
  <desc id="privacyDesc">Tệp được xử lý trong cửa sổ trình duyệt, không upload lên máy chủ, không lưu trữ và không telemetry nội dung.</desc>

  <defs>
    <filter id="privacyShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0a0a0a" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <text x="60" y="34" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.8" fill="#737373">ZERO-SERVER BY DESIGN</text>
  <text x="1140" y="34" text-anchor="end" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#a3a3a3">không API upload · không lưu dữ liệu · không telemetry nội dung</text>

  <!-- Browser window -->
  <g filter="url(#privacyShadow)"><rect x="60" y="64" width="600" height="190" rx="14" fill="#ffffff" stroke="#e5e5e5"/></g>
  <path d="M74 64h572a14 14 0 0 1 14 14v20H60V78a14 14 0 0 1 14-14z" fill="#f5f5f5"/>
  <circle cx="80" cy="81" r="4" fill="#d4d4d4"/>
  <circle cx="94" cy="81" r="4" fill="#d4d4d4"/>
  <circle cx="108" cy="81" r="4" fill="#d4d4d4"/>
  <rect x="132" y="72" width="190" height="18" rx="9" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M142 82v-2.5a2.5 2.5 0 0 1 5 0V82m-6 0h7v5h-7z" fill="none" stroke="#059669" stroke-width="1.1"/>
  <text x="156" y="85" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9.5" fill="#525252">recosheet.app</text>
  <circle cx="610" cy="81" r="3.5" fill="#059669"/>
  <text x="642" y="85" text-anchor="end" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#047857">100% local</text>
  <line x1="60" y1="98" x2="660" y2="98" stroke="#e5e5e5"/>

  <!-- Files inside browser -->
  <rect x="80" y="112" width="200" height="52" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="92" y="123" width="30" height="30" rx="7" fill="#fffbeb"/>
  <path d="M101 130h7l4 4v11h-11z" fill="none" stroke="#ea580c" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="110" y="135" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="6.5" fill="#ea580c">XLSX</text>
  <text x="132" y="134" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0a0a0a">so_quy_noi_bo.xlsx</text>
  <text x="132" y="150" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#737373">Tệp A · 10.000 dòng</text>

  <rect x="80" y="174" width="200" height="52" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="92" y="185" width="30" height="30" rx="7" fill="#f0f9ff"/>
  <path d="M101 192h7l4 4v11h-11z" fill="none" stroke="#0369a1" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="110" y="197" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="6.5" fill="#0369a1">CSV</text>
  <text x="132" y="196" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0a0a0a">sao_ke_ngan_hang.csv</text>
  <text x="132" y="212" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#737373">Tệp B · 8.240 dòng</text>

  <!-- Arrow -->
  <line x1="292" y1="168" x2="314" y2="168" stroke="#a3a3a3" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M309 163l5 5-5 5" fill="none" stroke="#a3a3a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Result inside browser -->
  <rect x="328" y="112" width="312" height="126" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="346" y="134" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#047857">KẾT QUẢ ĐỐI SOÁT</text>
  <circle cx="620" cy="130" r="3.5" fill="#059669"/>
  <g font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600">
    <rect x="346" y="144" width="132" height="24" rx="6" fill="#ffffff" stroke="#a7f3d0"/><text x="358" y="160" fill="#047857">8 khớp hoàn toàn</text>
    <rect x="488" y="144" width="132" height="24" rx="6" fill="#ffffff" stroke="#fde68a"/><text x="500" y="160" fill="#9a3412">2 lệch giá trị</text>
    <rect x="346" y="176" width="132" height="24" rx="6" fill="#ffffff" stroke="#fecdd3"/><text x="358" y="192" fill="#9f1239">2 chỉ có ở A</text>
    <rect x="488" y="176" width="132" height="24" rx="6" fill="#ffffff" stroke="#bae6fd"/><text x="500" y="192" fill="#075985">2 chỉ có ở B</text>
  </g>
  <text x="346" y="223" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="10.5" fill="#525252">Δ −95.000</text>
  <text x="622" y="223" text-anchor="end" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#047857">xong trong 90ms</text>

  <!-- Privacy panel -->
  <rect x="684" y="64" width="456" height="190" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="748" cy="126" r="46" fill="#ffffff" opacity="0.55"/>
  <path d="M748 84l34 12v26c0 24-14 39-34 48-20-9-34-24-34-48v-26z" fill="url(#shieldFill)"/>
  <path d="M733 126l10 10 21-21" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="812" y="108" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="16.5" font-weight="600" letter-spacing="-0.3" fill="#065f46">Dữ liệu không rời khỏi máy bạn</text>
  <g font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#065f46">
    <circle cx="820" cy="129" r="7" fill="#059669"/><path d="M817 129l2 2 4-4" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="836" y="133">Không upload lên server</text>
    <circle cx="820" cy="157" r="7" fill="#059669"/><path d="M817 157l2 2 4-4" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="836" y="161">Không lưu localStorage</text>
    <circle cx="820" cy="185" r="7" fill="#059669"/><path d="M817 185l2 2 4-4" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="836" y="189">Đóng tab là dữ liệu biến mất</text>
  </g>
  <rect x="812" y="208" width="168" height="26" rx="13" fill="#ffffff" stroke="#a7f3d0"/>
  <circle cx="828" cy="221" r="3.5" fill="#059669"/>
  <text x="838" y="225" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="10" fill="#047857">0 request · 0 telemetry</text>
</svg>
